[package]
name = "email-sync"
version = "0.1.0"
edition = "2021"
description = "把 IMAP 邮箱所有文件夹的邮件增量同步到本地 SQLite，附件打包 zip 存二进制字段"

[dependencies]
imap = "2"
imap-proto = "0.10"
native-tls = "0.2"
mailparse = "0.16"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
